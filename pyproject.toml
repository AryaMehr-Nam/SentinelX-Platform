[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E712", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["api", "waf"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["api", "waf"]
omit = ["*/tests/*", "*/migrations/*"]
