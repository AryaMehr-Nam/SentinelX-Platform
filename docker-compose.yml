services:
  # ──── PostgreSQL Database ────
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx-secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──── Redis ────
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    command: redis-server --requirepass sentinelx-redis --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sentinelx-redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──── Elasticsearch ────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: sentinelx-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=sentinelx-cluster
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles:
      - full  # Optional: only starts with --profile full

  # ──── FastAPI Application ────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sentinelx-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelx:sentinelx-secret@postgres:5432/sentinelx
      REDIS_URL: redis://:sentinelx-redis@redis:6379/0
      CELERY_BROKER_URL: redis://:sentinelx-redis@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:sentinelx-redis@redis:6379/2
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./waf:/app/waf

  # ──── Celery Worker ────
  celery-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sentinelx-celery-worker
    restart: unless-stopped
    command: celery -A api.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelx:sentinelx-secret@postgres:5432/sentinelx
      REDIS_URL: redis://:sentinelx-redis@redis:6379/0
      CELERY_BROKER_URL: redis://:sentinelx-redis@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:sentinelx-redis@redis:6379/2
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./waf:/app/waf

  # ──── Celery Beat (Scheduler) ────
  celery-beat:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sentinelx-celery-beat
    restart: unless-stopped
    command: celery -A api.workers.celery_app beat --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      CELERY_BROKER_URL: redis://:sentinelx-redis@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:sentinelx-redis@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  # ──── React Dashboard ────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sentinelx-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  esdata:
    driver: local
